<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar LocalStorage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <h1>Praktikum Local Storage</h1>
      <br />
      <form id="note-form">
        <label for="note">masukan note</label>
        <br />
        <input type="text" name="note" id="note" required />
        <br />
        <label for="keterangan">Keterangan</label>
        <br />
        <select name="label" id="label" required>
          <option value="">Pilih Keterangan</option>
          <option value="prioritas">Prioritas</option>
          <option value="medium">Medium</option>
        </select>
        <br />
        <button type="submit">kirim</button>
      </form>

      <br />
      <ul id="data-tampil" aria-live="polite"></ul>
      <button id="delete-all" type="button">Hapus semua data</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
